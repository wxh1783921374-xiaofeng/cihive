[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cihive"
version = "0.1.0"
description = "Evidence-first distributed CI repair agents running on GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CIHive contributors" }]
keywords = ["agents", "ci", "github-actions", "openai", "repair"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "openai-agents>=0.2,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
cihive = "cihive.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cihive"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/evals",
  "/templates",
  "/docs",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.tmp/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".tmp/.pytest_cache"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["cihive"]
